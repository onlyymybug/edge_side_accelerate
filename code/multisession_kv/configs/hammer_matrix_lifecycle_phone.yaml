# Phone validation of the conservative serial-arrival Lifecycle-LRU policy.
# Only full N=4 and N=8 groups are included; the incomplete two-Session tail
# groups are excluded by the per-block group limits.
seed: 4243
repeats: 1
max_groups_per_session_count: null
experiments:
  - name: lifecycle_n4
    session_counts: [4]
    max_groups_per_session_count: 12
    schedules: [round_robin]
    policies:
      - name: lru
        budget_ratios: [0.5, 0.75]
      - name: lifecycle_lru
        budget_ratios: [0.5, 0.75]

  - name: lifecycle_n8
    session_counts: [8]
    max_groups_per_session_count: 6
    schedules: [round_robin]
    policies:
      - name: lru
        budget_ratios: [0.25, 0.5, 0.75]
      - name: lifecycle_lru
        budget_ratios: [0.25, 0.5, 0.75]

max_new_tokens: 64
htp_mode: 8
request_timeout_seconds: 180
warmup: true
telemetry_interval_seconds: 1
require_not_charging: true
temperature_gate:
  enabled: true
  sensor: skin
  max_start_c: 28.2
  consecutive_samples: 3
  poll_seconds: 10
  timeout_seconds: 1800
