seed: 42
session_counts: [1, 2, 4, 8]
max_groups_per_session_count: null
repeats: 3
schedules: [grouped, round_robin]
policies:
  - name: all_keep
  - name: no_reuse
  - name: single_slot
  - name: lru
    budget_ratios: [0.25, 0.5, 0.75]
max_new_tokens: 64
htp_mode: 8
request_timeout_seconds: 180
warmup: true
telemetry_interval_seconds: 1
require_not_charging: true
temperature_gate:
  enabled: true
  sensor: skin
  # Redmi stable idle baseline on 2026-10-08: median 27.139 C, range 0.139 C.
  max_start_c: 28.2
  consecutive_samples: 3
  poll_seconds: 10
  timeout_seconds: 1800
